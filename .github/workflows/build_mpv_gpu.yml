name: Build mpv 0.34 (waf) with EGL/DRM GPU for Miyoo Flip 2

on:
  workflow_dispatch:

env:
  TOOLCHAIN: aarch64-flip-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget tar xz-utils python3 pkg-config
          python3 --version

      - name: Checkout repo (runtime libs)
        uses: actions/checkout@v4

      - name: Download Miyoo Flip cross toolchain
        run: |
          wget -q https://github.com/steward-fu/website/releases/download/miyoo-flip/flip-toolchain-v1.0.tar.gz -O tc.tar.gz
          tar xf tc.tar.gz
          echo "TOOLCHAIN_ROOT=$(pwd)/flip" >> $GITHUB_ENV
          SR=$(${TOOLCHAIN}-gcc -print-sysroot 2>/dev/null || echo "$(pwd)/flip/aarch64-flip-linux-gnu/sysroot")
          echo "SYSROOT=$SR" >> $GITHUB_ENV
          export PATH="$(pwd)/flip/bin:$PATH"
          SR=$(${TOOLCHAIN}-gcc -print-sysroot)
          echo "SYSROOT=$SR" >> $GITHUB_ENV
          echo "sysroot = $SR"

      - name: Download mpv source + bootstrap waf
        run: |
          wget -q https://github.com/mpv-player/mpv/archive/refs/tags/v0.34.0.tar.gz -O mpv.tar.gz
          tar xf mpv.tar.gz
          cd mpv-0.34.0 && python3 ./bootstrap.py && test -x waf && echo "waf OK"

      - name: Install runtime libs + headers into sysroot
        run: |
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          SR=$(${TOOLCHAIN}-gcc -print-sysroot)
          # runtime libs from stock mpv package (AArch64, ffmpeg 4.4 / libass 0.14)
          tar xzf runtime_libs.tar.gz
          cp -a lib/*.so* "$SR/usr/lib/" 2>/dev/null || true
          # create unversioned symlinks so the linker can find -lavcodec etc.
          cd "$SR/usr/lib"
          for f in libavcodec.so.58 libavformat.so.58 libavutil.so.56 \
                   libswscale.so.5 libswresample.so.3 libavfilter.so.7 \
                   libavdevice.so.58 libass.so.9 libharfbuzz.so.0 \
                   libluajit-5.1.so.2; do
            base=$(echo "$f" | sed 's/\.so\..*/.so/')
            [ -e "$base" ] || ln -s "$f" "$base" 2>/dev/null || true
          done
          echo "=== staged libs ==="
          ls -la "$SR/usr/lib" | grep -iE 'avcodec|avformat|libass|harfbuzz|luajit' | head -30

          # ---- headers from matching source tarballs ----
          cd "$GITHUB_WORKSPACE"
          # FFmpeg 4.4.4 headers (libavcodec 58.134.100 matches)
          wget -q https://ffmpeg.org/releases/ffmpeg-4.4.4.tar.xz -O ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          for d in libavcodec libavformat libavutil libswscale libswresample libavfilter libavdevice; do
            mkdir -p "$SR/usr/include/$d"
            cp ffmpeg-4.4.4/$d/*.h "$SR/usr/include/$d/" 2>/dev/null || true
          done
          # libass header -> must be in ass/ subdir (#include <ass/ass.h>)
          wget -q https://github.com/libass/libass/releases/download/0.15.2/libass-0.15.2.tar.gz -O libass.tar.gz
          tar xf libass.tar.gz
          mkdir -p "$SR/usr/include/ass"
          cp libass-0.15.2/libass/*.h "$SR/usr/include/ass/" 2>/dev/null || true

          # generated ffmpeg config headers (avconfig.h etc.) are produced by
          # ffmpeg's configure, not shipped in the source tarball. Generate
          # them by configuring ffmpeg for aarch64 (no compilation needed).
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          cd ffmpeg-4.4.4
          ./configure \
            --cross-prefix=${TOOLCHAIN}- \
            --arch=aarch64 --target-os=linux \
            --enable-shared --disable-programs --disable-doc \
            --disable-x86asm --disable-autodetect \
            --prefix=/usr >/dev/null 2>&1 || true
          # copy generated config headers back
          for h in libavutil/avconfig.h libavutil/ffversion.h \
                   libavcodec/avcodec.h libavfilter/avfilter.h; do
            [ -f "$h" ] && cp "$h" "$SR/usr/include/$h" 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE"
          echo "=== generated headers ==="
          ls -la "$SR/usr/include/libavutil/avconfig.h" 2>/dev/null || echo "avconfig.h MISSING"

          # ---- pkg-config files pointing to the staged libs ----
          PC="$SR/usr/lib/pkgconfig"; mkdir -p "$PC"
          mpc() {
            local name=$1 desc=$2 ver=$3 libs=$4 file=$5
            printf '%s\n' "prefix=/usr" 'exec_prefix=${prefix}' 'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' "Name: $name" "Description: $desc" \
              "Version: $ver" "Libs: -L\${libdir} $libs" "Cflags: -I\${includedir}" > "$PC/$file.pc"
          }
          mpc libavutil  'libavutil'     '56.51.100' '-lavutil'       libavutil
          mpc libavcodec 'libavcodec'    '58.134.100' '-lavcodec -lavutil' libavcodec
          mpc libavformat 'libavformat'  '58.76.100' '-lavformat -lavcodec -lavutil -lswresample' libavformat
          mpc libswscale 'libswscale'    '5.3.100'  '-lswscale -lavutil' libswscale
          mpc libswresample 'libswresample' '3.7.100' '-lswresample -lavutil' libswresample
          mpc libavfilter 'libavfilter'  '7.110.100' '-lavfilter -lavcodec -lavformat -lavutil -lswscale -lswresample' libavfilter
          mpc libavdevice 'libavdevice'  '58.10.100' '-lavdevice -lavformat -lavcodec -lavutil' libavdevice
          mpc libass     'libass'        '0.15.2'   '-lass -lharfbuzz' libass
          echo "=== .pc created ==="
          ls "$PC" | grep -iE 'av|ass' | sort

      - name: Configure mpv (WAF)
        run: |
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          SR=$(${TOOLCHAIN}-gcc -print-sysroot)
          export PKG_CONFIG_PATH="$SR/usr/lib/pkgconfig:$SR/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SR"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
          export CC=${TOOLCHAIN}-gcc
          cd mpv-0.34.0
          python3 ./waf configure \
            --prefix=/usr \
            --disable-libplacebo --disable-vulkan --disable-x11 \
            --disable-wayland --disable-sdl2-video \
            --disable-cocoa --disable-win32 \
            --disable-lua 2>&1 | tee configure.log
          echo "CONFIGURE_EXIT=${PIPESTATUS[0]}"

      - name: Build mpv (WAF)
        run: |
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          SR=$(${TOOLCHAIN}-gcc -print-sysroot)
          export PKG_CONFIG_PATH="$SR/usr/lib/pkgconfig:$SR/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SR"
          export CC=${TOOLCHAIN}-gcc
          cd mpv-0.34.0
          python3 ./waf build -j4 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          ls -la build/mpv && file build/mpv
          cp build/mpv ../mpv-gpu

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-build-logs
          path: |
            mpv-0.34.0/configure.log
            mpv-0.34.0/build.log
          if-no-files-found: ignore

      - name: Package binary + needed system libs
        if: success()
        run: |
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          SR=$(${TOOLCHAIN}-gcc -print-sysroot)
          mkdir -p package/lib
          cp mpv-gpu package/
          # Include GPU/system libs the stock mpv package lacks. Use cp -L to
          # dereference symlinks so we ship REAL files (a copied symlink would
          # become a 0-byte broken file and could clobber the device's libs).
          for lib in libEGL.so.1 libGLESv2.so.2 libgbm.so.1 libdrm.so.2 \
                     libjpeg.so.8; do
            f=$(find "$SR/usr/lib" -name "$lib" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp -L "$f" "package/lib/$lib" 2>/dev/null || true
            fi
          done
          echo "=== package contents (verify no 0-byte files) ==="
          ls -la package package/lib
          tar czf mpv-gpu-package.tar.gz -C package .
          ls -la mpv-gpu-package.tar.gz

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-gpu-aarch64
          path: mpv-gpu

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-gpu-package
          path: mpv-gpu-package.tar.gz
